<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pédantix — test mobile</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 1rem;
      background: #121212;
      color: #eee;
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.5;
      max-width: 720px;
      margin-inline: auto;
    }
    h1 { font-size: 1.4rem; margin: 0 0 0.25rem; }
    .subtitle { color: #888; font-size: 0.9rem; margin-bottom: 1rem; }
    .title-area { margin-bottom: 1rem; min-height: 1.5em; }
    .title-correct { color: #4caf50; font-weight: bold; }
    .title-wrong { color: #f44336; }
    #error {
      display: none;
      background: #3a1515;
      border: 1px solid #f44336;
      color: #ffcdd2;
      padding: 0.6rem 0.8rem;
      border-radius: 6px;
      margin-bottom: 1rem;
    }
    #history {
      margin-bottom: 1rem;
      min-height: 1.5em;
    }
    .guess {
      display: inline-block;
      margin: 0.15rem 0.4rem 0.15rem 0;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      font-size: 0.9rem;
      background: #1e1e1e;
    }
    .guess.exact { color: #4caf50; }
    .guess.hot { color: #ff9800; }
    .guess.cold { color: #f44336; }
    #article {
      background: #1a1a1a;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1.2rem;
      line-height: 1.8;
    }
    .visible { color: #aaa; }
    .revealed-close { color: #ff9800; }
    .revealed-exact { color: #4caf50; }
    .blank { vertical-align: bottom; margin: 0 1px; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
      align-items: center;
    }
    input[type="text"] {
      flex: 1;
      min-width: 140px;
      padding: 0.55rem 0.7rem;
      border: 1px solid #444;
      border-radius: 6px;
      background: #1e1e1e;
      color: #eee;
      font-size: 1rem;
    }
    button {
      padding: 0.55rem 1rem;
      border: none;
      border-radius: 6px;
      background: #333;
      color: #eee;
      font-size: 0.95rem;
      cursor: pointer;
    }
    button:hover { background: #444; }
    button.primary { background: #1565c0; }
    button.primary:hover { background: #1976d2; }
    #toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #333;
      color: #eee;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      opacity: 0;
      transition: transform 0.25s, opacity 0.25s;
      pointer-events: none;
      z-index: 100;
    }
    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    .section-label {
      font-size: 0.8rem;
      color: #666;
      margin-bottom: 0.3rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <h1>Pédantix — test mobile</h1>
  <p class="subtitle" id="puzzle-info">Chargement…</p>
  <div class="title-area" id="title-area"></div>
  <div id="error"></div>
  <div id="history"></div>
  <div id="article">Chargement de l'article…</div>

  <div class="section-label">Proposer un mot</div>
  <div class="controls">
    <input type="text" id="word-input" placeholder="Votre mot" autocomplete="off">
    <button class="primary" id="btn-guess">Proposer</button>
  </div>

  <div class="section-label">Deviner le titre</div>
  <div class="controls">
    <input type="text" id="title-input" placeholder="Titre de l'article" autocomplete="off">
    <button id="btn-title">Trouver le titre</button>
  </div>

  <div class="controls">
    <button id="btn-share">Partager</button>
  </div>

  <div id="toast"></div>

  <script>
    const state = {
      num: 0,
      tokens: [],
      levels: new Map(), // pos -> "exact" | "proche" (révélations par position)
      thresholds: { exact: 0.85, proche: 0.49 },
      guesses: [],
    };

    const $ = (id) => document.getElementById(id);

    function showError(msg) {
      const el = $("error");
      el.textContent = msg;
      el.style.display = msg ? "block" : "none";
    }

    function showToast(msg) {
      const el = $("toast");
      el.textContent = msg;
      el.classList.add("show");
      setTimeout(() => el.classList.remove("show"), 2000);
    }

    // Cohérence avec le serveur : le niveau d'un essai se décide sur le
    // COSINUS brut comparé aux seuils (exact/proche) renvoyés par /puzzle.
    // Le score affiché (g.score) est normalisé (cos+1)/2 — il ne faut pas le
    // comparer directement aux seuils bruts.
    function guessCosine(g) {
      return g.cosine != null ? g.cosine : g.score * 2 - 1;
    }

    function guessClass(g) {
      if (g.exact) return "exact";
      const cos = guessCosine(g);
      if (cos >= state.thresholds.exact) return "exact";
      if (cos >= state.thresholds.proche) return "hot";
      return "cold";
    }

    function emojiForGuess(g) {
      if (g.exact) return "🟩";
      const cos = guessCosine(g);
      if (cos >= state.thresholds.exact) return "🟩";
      if (cos >= state.thresholds.proche) return "🟧";
      return "🟥";
    }

    function renderHistory() {
      $("history").innerHTML = state.guesses.map((g) =>
        `<span class="guess ${guessClass(g)}">${escapeHtml(g.word)} — ${g.score.toFixed(2)}</span>`
      ).join("");
    }

    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function renderArticle() {
      // Fidélité à l'original : au départ AUCUN mot n'est visible. Seuls les
      // tokens dont la position a franchi un seuil (via /score) s'affichent,
      // en vert (exact) ou orange (proche). Les autres restent des espaces
      // de même largeur.
      const parts = state.tokens.map((t, i) => {
        const level = state.levels.get(i);
        if (level === "exact") {
          return `<span class="revealed-exact">${escapeHtml(t.w)}</span>`;
        }
        if (level === "proche") {
          return `<span class="revealed-close">${escapeHtml(t.w)}</span>`;
        }
        const len = t.w.length;
        return `<span class="blank" style="display:inline-block;min-width:calc(1ch * ${len});border-bottom:2px solid #555;height:1.2em"></span>`;
      });
      $("article").innerHTML = parts.join(" ");
    }

    async function loadPuzzle() {
      showError("");
      try {
        const resp = await fetch("/puzzle");
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();
        state.num = data.num;
        state.tokens = data.tokens;
        state.levels = new Map();
        if (data.thresholds) {
          state.thresholds = data.thresholds;
        }
        // Restaure les révélations déjà acquises (état serveur) : le score
        // courant de chaque position détermine son niveau d'affichage.
        if (Array.isArray(data.scores)) {
          data.scores.forEach((s, i) => {
            if (s >= state.thresholds.exact) state.levels.set(i, "exact");
            else if (s >= state.thresholds.proche) state.levels.set(i, "proche");
          });
        }
        state.guesses = [];
        $("puzzle-info").textContent = `Pédantix #${data.num}`;
        $("title-area").innerHTML = "";
        renderHistory();
        renderArticle();
      } catch (e) {
        showError("Impossible de charger le puzzle : " + e.message);
        $("article").textContent = "Erreur de chargement.";
      }
    }

    async function submitGuess() {
      const word = $("word-input").value.trim();
      if (!word) return;
      showError("");
      try {
        const resp = await fetch("/score", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ num: state.num, word }),
        });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();
        state.guesses.push({ word: data.word, score: data.score, cosine: data.cosine, exact: data.exact });
        // Applique les révélations par position (franchissement de seuil) :
        // l'état s'accumule entre les essais, le vert gagne sur l'orange.
        (data.updates || []).forEach((u) => {
          state.levels.set(u.pos, u.level);
        });
        renderHistory();
        renderArticle();
        $("word-input").value = "";
        $("word-input").focus();
      } catch (e) {
        showError("Erreur lors du score : " + e.message);
      }
    }

    async function submitTitle() {
      const answer = $("title-input").value.trim();
      if (!answer) return;
      showError("");
      try {
        const resp = await fetch("/page", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ num: state.num, answer }),
        });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();
        const area = $("title-area");
        if (data.correct) {
          area.innerHTML = `<span class="title-correct">${escapeHtml(data.title)}</span>`;
        } else {
          area.innerHTML = `<span class="title-wrong">Non…</span>`;
        }
      } catch (e) {
        showError("Erreur titre : " + e.message);
      }
    }

    async function share() {
      const line1 = `Pédantix #${state.num} — ${state.guesses.length} essais`;
      const line2 = state.guesses.map(emojiForGuess).join("");
      const text = line2 ? line1 + "\n" + line2 : line1;
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(text);
        } else {
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.style.position = "fixed";
          ta.style.left = "-9999px";
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
        }
        showToast("Copié !");
      } catch (e) {
        showError("Impossible de copier : " + e.message);
      }
    }

    $("btn-guess").addEventListener("click", submitGuess);
    $("word-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") submitGuess();
    });
    $("btn-title").addEventListener("click", submitTitle);
    $("title-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") submitTitle();
    });
    $("btn-share").addEventListener("click", share);

    loadPuzzle();
  </script>
</body>
</html>
