<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pédantix — test mobile</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 1rem;
      background: #121212;
      color: #eee;
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.5;
      max-width: 720px;
      margin-inline: auto;
    }
    h1 { font-size: 1.4rem; margin: 0 0 0.25rem; }
    .subtitle { color: #888; font-size: 0.9rem; margin-bottom: 1rem; }
    .title-area { margin-bottom: 1rem; min-height: 1.5em; }
    .title-correct { color: #4caf50; font-weight: bold; font-size: 1.05rem; }
    .puzzle-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin: 0 0 0.25rem;
      padding: 0.5rem 0.75rem;
      background: #1a1a1a;
      border-radius: 8px;
      border-left: 3px solid #1565c0;
      line-height: 1.8;
    }
    #error {
      display: none;
      background: #3a1515;
      border: 1px solid #f44336;
      color: #ffcdd2;
      padding: 0.6rem 0.8rem;
      border-radius: 6px;
      margin-bottom: 1rem;
    }
    #history {
      margin-bottom: 1rem;
      min-height: 1.5em;
    }
    .history-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    .history-table th,
    .history-table td {
      padding: 0.3rem 0.5rem;
      text-align: left;
      border-bottom: 1px solid #2a2a2a;
    }
    .history-table th {
      color: #888;
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .history-table td.num { color: #888; width: 2.5em; }
    #article {
      background: #1a1a1a;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1.2rem;
      line-height: 1.8;
    }
    .revealed-exact { color: #4caf50; }
    .revealed-close {
      display: inline-block;
      background: rgb(51, 51, 51);
      color: #ff9800; /* défaut ; surchargé en inline par le dégradé (cos) */
      min-width: 1.5em;
      text-align: center;
      padding: 0 0.3em;
      border-radius: 4px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
    }
    .blank { vertical-align: bottom; margin: 0 1px; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
      align-items: center;
    }
    input[type="text"] {
      flex: 1;
      min-width: 140px;
      padding: 0.55rem 0.7rem;
      border: 1px solid #444;
      border-radius: 6px;
      background: #1e1e1e;
      color: #eee;
      font-size: 1rem;
    }
    input[type="text"]:disabled { opacity: 0.5; }
    button {
      padding: 0.55rem 1rem;
      border: none;
      border-radius: 6px;
      background: #333;
      color: #eee;
      font-size: 0.95rem;
      cursor: pointer;
    }
    button:hover { background: #444; }
    button.primary { background: #1565c0; }
    button.primary:hover { background: #1976d2; }
    button:disabled { opacity: 0.5; cursor: default; }
    #toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #333;
      color: #eee;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      opacity: 0;
      transition: transform 0.25s, opacity 0.25s;
      pointer-events: none;
      z-index: 100;
    }
    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    #toast.success { background: #1b5e20; }
    .section-label {
      font-size: 0.8rem;
      color: #666;
      margin-bottom: 0.3rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    #feedback {
      min-height: 1.4em;
      font-size: 1rem;
      letter-spacing: 0.1em;
      margin: 0.35rem 0 0.6rem;
    }
  </style>
</head>
<body>
  <h1>Pédantix — test mobile</h1>
  <p class="subtitle" id="puzzle-info">Chargement…</p>
  <div class="title-area" id="title-area"></div>
  <div id="error"></div>
  <div id="history"></div>
  <div id="article">Chargement de l'article…</div>

  <div class="section-label">Proposer un mot ou le titre</div>
  <div class="controls">
    <input type="text" id="word-input" placeholder="Votre mot (ou le titre)" autocomplete="off">
    <button class="primary" id="btn-guess">Proposer</button>
  </div>
  <div id="feedback"></div>

  <div class="controls">
    <button id="btn-share">Partager</button>
  </div>

  <div id="toast"></div>

  <script>
    const state = {
      num: 0,
      title: "",
      titleWords: [],        // mots du titre (h2), révélés indépendamment
      titleRevealed: new Map(), // idx -> "exact"|"proche" (vert gagne)
      tokens: [],
      revealed: new Map(), // pos -> "exact"|"proche" (mots révélés, état 100 % client)
      revealedCos: new Map(), // pos -> cosinus de la révélation orange (dégradé)
      guesses: [],          // { word, score, level: "exact"|"proche"|"froid" }
      won: false,
    };

    const $ = (id) => document.getElementById(id);

    function showError(msg) {
      const el = $("error");
      el.textContent = msg;
      el.style.display = msg ? "block" : "none";
    }

    function showToast(msg, success) {
      const el = $("toast");
      el.textContent = msg;
      el.classList.toggle("success", !!success);
      el.classList.add("show");
      setTimeout(() => el.classList.remove("show"), 2500);
    }

    function emojiForGuess(g) {
      if (g.present || g.level === "exact") return "🟩";
      if (g.level === "proche") return "🟧";
      return "🟥";
    }

    function renderHistory() {
      // Tableau compact « Nº | Mot », les plus récents en haut (comme l'original).
      const rows = state.guesses
        .map((g, i) => ({ g, num: i + 1 }))
        .reverse()
        .map(({ g, num }) => `<tr><td class="num">${num}</td><td>${escapeHtml(g.word)}</td></tr>`)
        .join("");
      $("history").innerHTML =
        `<table class="history-table"><thead><tr><th>Nº</th><th>Mot</th></tr></thead>` +
        `<tbody>${rows || `<tr><td colspan="2" style="color:#666">Aucun essai</td></tr>`}</tbody></table>`;
    }

    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Dégradé d'orange pour les révélations « proche » : cos 0.49 -> jaune/
    // orange clair rgb(255,191,0), cos 0.85 -> orange vif rgb(255,105,0),
    // borné entre les deux (valeur par défaut 0.67 si cos absent).
    function orangeColor(cos) {
      const c = cos == null ? 0.67 : Math.min(Math.max(cos, 0.49), 0.85);
      const t = (c - 0.49) / (0.85 - 0.49);
      const g = Math.round(191 - 86 * t);
      return `rgb(255, ${g}, 0)`;
    }

    function renderArticle() {
      // Article masqué au départ. Seuls les mots proposés présents dans
      // l'article s'affichent, en VERT (revealed_positions de /score) ; les
      // mots PROCHES s'affichent en ORANGE (article_updates). Rien n'est
      // restauré depuis le serveur : état local uniquement. Vert gagne.
      const parts = state.tokens.map((t, i) => {
        const lvl = state.revealed.get(i);
        if (lvl === "exact") {
          return `<span class="revealed-exact">${escapeHtml(t.w)}</span>`;
        }
        if (lvl === "proche") {
          // Texte affiché = display = LA PROPOSITION (cosinus) ; le mot réel
          // de l'article reste accessible via state.tokens[i].w. Couleur :
          // dégradé d'orange interpolé depuis le cosinus (fond gris sombre +
          // ombre légère + min-width, comme l'original).
          const txt = state.revealedText.get(i) || t.w;
          const color = orangeColor(state.revealedCos.get(i));
          return `<span class="revealed-close" style="color:${color}">${escapeHtml(txt)}</span>`;
        }
        const len = t.w.length;
        return `<span class="blank" style="display:inline-block;min-width:calc(1ch * ${len});border-bottom:2px solid #555;height:1.2em"></span>`;
      });
      $("article").innerHTML = parts.join(" ");
    }

    function renderTitle() {
      // Titre masqué en haut de l'article (h2), mots révélés en vert/orange
      // quand ils sont touchés par /score (title_updates).
      const parts = state.titleWords.map((w, i) => {
        const lvl = state.titleRevealed.get(i);
        if (lvl === "exact") {
          return `<span class="revealed-exact">${escapeHtml(w)}</span>`;
        }
        if (lvl === "proche") {
          // Texte affiché = display = LA PROPOSITION (lemme OU cosinus) ; le
          // mot réel du titre reste accessible via titleWords[i].
          const txt = state.titleRevealedText.get(i) || w;
          return `<span class="revealed-close">${escapeHtml(txt)}</span>`;
        }
        const len = w.length;
        return `<span class="blank" style="display:inline-block;min-width:calc(1ch * ${len});border-bottom:2px solid #555;height:1.2em"></span>`;
      });
      $("title-area").innerHTML = `<h2 class="puzzle-title">${parts.join(" ")}</h2>`;
    }

    function win() {
      state.won = true;
      $("title-area").innerHTML =
        `<span class="title-correct">Bravo ! Le titre était : ${escapeHtml(state.title)}</span>`;
      $("word-input").disabled = true;
      $("btn-guess").disabled = true;
      showToast("Bravo ! Titre trouvé 🎉", true);
    }

    async function loadPuzzle() {
      showError("");
      try {
        const resp = await fetch("/puzzle");
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();
        state.num = data.num;
        state.title = data.title;
        state.titleWords = data.title_words || [];
        state.tokens = data.tokens;
        state.revealed = new Map(); // jamais de restauration serveur
        state.revealedText = new Map(); // texte affiché pour l'orange (display)
        state.revealedCos = new Map(); // cosinus de chaque orange (dégradé)
        state.titleRevealed = new Map();
        state.titleRevealedText = new Map();
        state.guesses = [];
        state.won = false;
        $("feedback").textContent = "";
        $("puzzle-info").textContent = `Pédantix #${data.num}`;
        $("word-input").disabled = false;
        $("btn-guess").disabled = false;
        renderHistory();
        renderTitle();
        renderArticle();
      } catch (e) {
        showError("Impossible de charger le puzzle : " + e.message);
        $("article").textContent = "Erreur de chargement.";
      }
    }

    async function submitGuess() {
      const word = $("word-input").value.trim();
      if (!word || state.won) return;
      showError("");
      try {
        const resp = await fetch("/score", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ num: state.num, word }),
        });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();
        state.guesses.push({
          // La PROPOSITION affichée = ce que le joueur a tapé (la température
          // vient du serveur, pas de réécriture du mot).
          word: word,
          score: data.score != null ? data.score : 0,
          level: data.temperature_level || "froid",
          present: !!data.present_in_article,
        });
        // Révélations : VERT pour la présence exacte (revealed_positions),
        // ORANGE pour les mots proches (article_updates / title_updates).
        // État local uniquement ; le VERT gagne sur l'ORANGE.
        // Pour l'orange, le texte affiché = u.display (la proposition pour
        // une révélation par lemme, le mot réel pour le cosinus) ; le mot
        // réel reste dans u.word (debug). Le vert affiche toujours le mot réel.
        (data.revealed_positions || []).forEach((pos) => {
          state.revealed.set(pos, "exact");
        });
        (data.article_updates || []).forEach((u) => {
          if (state.revealed.get(u.pos) !== "exact") {
            state.revealed.set(u.pos, u.level);
            state.revealedText.set(u.pos, u.display || u.word);
            if (u.cos != null) state.revealedCos.set(u.pos, u.cos);
          }
        });
        (data.title_updates || []).forEach((u) => {
          if (state.titleRevealed.get(u.idx) !== "exact") {
            state.titleRevealed.set(u.idx, u.level);
            state.titleRevealedText.set(u.idx, u.display || u.word);
          }
        });
        renderHistory();
        renderTitle();
        renderArticle();
        renderFeedback(data);
        $("word-input").value = "";
        if (data.title_found) {
          win();
        } else {
          $("word-input").focus();
        }
      } catch (e) {
        showError("Erreur lors du score : " + e.message);
      }
    }

    // Feedback émojis du DERNIER essai, sous l'input : 🟩×N pour chaque vert
    // (positions révélées dans l'article + mots du titre exacts), 🟧×M pour
    // chaque orange (article_updates), 🟥 seul si aucun vert ni orange.
    // Ex. : « 🟩×16 🟧×8 » ; « banane » -> « 🟥 ».
    function renderFeedback(data) {
      const greens =
        (data.revealed_positions || []).length +
        (data.title_updates || []).filter((u) => u.level === "exact").length;
      const oranges = (data.article_updates || []).length;
      let line = "";
      if (greens + oranges === 0) {
        line = "🟥";
      } else {
        if (greens > 0) line += `🟩×${greens}`;
        if (oranges > 0) line += (line ? " " : "") + `🟧×${oranges}`;
      }
      $("feedback").textContent = line;
    }

    async function share() {
      const line1 = `Pédantix #${state.num} — ${state.guesses.length} essais`;
      const line2 = state.guesses.map(emojiForGuess).join("");
      const text = line2 ? line1 + "\n" + line2 : line1;
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(text);
        } else {
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.style.position = "fixed";
          ta.style.left = "-9999px";
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
        }
        showToast("Copié !");
      } catch (e) {
        showError("Impossible de copier : " + e.message);
      }
    }

    $("btn-guess").addEventListener("click", submitGuess);
    $("word-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") submitGuess();
    });
    $("btn-share").addEventListener("click", share);

    loadPuzzle();
  </script>
</body>
</html>
