/*
  Module d'app cultureFirst (1080 × 1920). Ouvrir avec ?projet=<dossier>.
  Écrans repris des captures des stores (cultureFirst/store-screenshots) et du
  code de l'app : étude, accueil, catalogue, deck, stats, onboarding, fin de
  séance, « Réviser plus », écran d'accueil iOS avec widgets, écran verrouillé.
  Superpositions : courbe de mémoire, bulle, titre, tampon, chrono, chiffre.
  Tout est piloté par renderAt(t). Doc : README.md.
*/
@font-face { font-family: "Ionicons"; src: url("Ionicons.ttf") format("truetype"); }
* { box-sizing: border-box; }
html, body { margin: 0; background: #111; }

/* Marque en haut */

/* Téléphone */

#viewport { width: calc(393px * 2.2); height: calc(852px * 2.2); border-radius: 124px; overflow: hidden; position: relative; }
.screen { width: 393px; height: 852px; transform: scale(2.2); transform-origin: top left; background: var(--a-bg); color: var(--a-text); font-family: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; position: relative; overflow: hidden; }

.status .bars b::after { content: ""; position: absolute; inset: 1.5px; right: 5px; background: currentColor; border-radius: 1.5px; }

.view { position: absolute; inset: 0; padding-top: 54px; background: var(--a-bg); visibility: hidden; }
.pad { padding: 0 16px; display: flex; flex-direction: column; gap: 16px; }

/* Kit (src/ui, theme.ts) */

.heading { font-size: 17px; font-weight: 600; letter-spacing: -0.2px; }
.caption { font-size: 12px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; color: var(--a-muted); }
.card { background: var(--a-surface); border-radius: 16px; border: 1px solid var(--a-border); }

#vs-d { left: 560px; padding-left: 90px; padding-right: 70px; background: linear-gradient(160deg, #F07A2C, #C2410C); }
.vs-side .emo { font-size: 170px; line-height: 1; }

/* Format « typographie » : texte géant plein écran, mot à mot */
#typo { position: absolute; inset: 0; z-index: 5; display: none; background: radial-gradient(70% 50% at 50% 45%, var(--fond2), var(--fond)); }
#ty-bloc { position: absolute; left: 100px; right: 160px; top: 860px; translate: 0 -50%; display: flex; flex-direction: column; align-items: center; gap: 50px; text-align: center; }
#ty-txt { position: relative; font-family: var(--titre); font-weight: 600; letter-spacing: -0.02em; line-height: 1.05; color: var(--creme); }
#ty-txt .w { display: inline-block; }
#ty-txt em { font-style: normal; color: var(--accent); }
#ty-barre { position: absolute; left: -10px; top: 52%; height: 14px; border-radius: 7px; background: #FF4D4D; }
#ty-cor { font-family: var(--titre); font-weight: 700; color: #51CF66; letter-spacing: -0.02em; line-height: 1.05; }
#ty-sous { font-size: 52px; font-weight: 700; color: var(--creme); line-height: 1.25; }

/* Format « carte du monde » */
#monde { position: absolute; inset: 0; z-index: 5; display: none; background: #170B20; overflow: hidden; }
#monde svg { position: absolute; inset: 0; }
#mo-titre { position: absolute; left: 90px; right: 150px; top: 180px; margin: 0; text-align: center; font-family: var(--titre); font-weight: 600; font-size: 70px; line-height: 1.05; color: var(--creme); text-shadow: 0 6px 20px rgb(0 0 0 / .6); }
#mo-nom { position: absolute; left: 110px; right: 170px; top: 1230px; text-align: center; font-family: var(--titre); font-weight: 700; font-size: 110px; color: var(--accent); text-shadow: 0 8px 24px rgb(0 0 0 / .7); }
.pin { position: absolute; translate: -50% -100%; display: flex; flex-direction: column; align-items: center; gap: 6px; white-space: nowrap; transform-origin: 50% 100%; }
.pin span { background: #fff; color: #1B1320; border-radius: 999px; padding: 8px 22px; font-size: 38px; font-weight: 800; box-shadow: 0 8px 20px rgb(0 0 0 / .4); }
.pin i { width: 34px; height: 34px; border-radius: 17px; border: 7px solid #fff; display: block; box-shadow: 0 4px 12px rgb(0 0 0 / .5); }

/* Format « frise chronologique » */
#frise { position: absolute; inset: 0; z-index: 5; display: none; background: radial-gradient(70% 50% at 50% 45%, var(--fond2), var(--fond)); }
#fr-titre { position: absolute; left: 90px; right: 150px; top: 180px; margin: 0; text-align: center; font-family: var(--titre); font-weight: 600; font-size: 68px; line-height: 1.05; color: var(--creme); }
#fr-axe { position: absolute; left: 300px; width: 10px; border-radius: 5px; background: rgb(255 255 255 / .25); }
.jalon { position: absolute; left: 0; right: 0; height: 0; }
.jalon .an { position: absolute; left: 60px; translate: 0 -50%; font-size: 36px; font-weight: 800; color: var(--accent); text-align: right; line-height: 1.05; }
.jalon .pt { position: absolute; left: 290px; width: 30px; height: 30px; border-radius: 15px; background: var(--accent); translate: 0 -50%; box-shadow: 0 0 0 8px rgb(245 197 24 / .25); }
.jalon .ev { position: absolute; left: 350px; max-width: 530px; translate: 0 -50%; background: var(--creme); color: #1B1320; border-radius: 28px; padding: 18px 28px; font-size: 40px; font-weight: 700; line-height: 1.15; box-shadow: 0 14px 30px rgb(0 0 0 / .35); }
.ecart { position: absolute; left: 270px; width: 70px; border-radius: 35px; background: rgb(245 197 24 / .22); border: 4px solid var(--accent); }
.ecart-l { position: absolute; left: 540px; translate: -50% -50%; background: var(--accent); color: #1B1320; border-radius: 999px; padding: 14px 34px; font-size: 44px; font-weight: 800; white-space: nowrap; z-index: 3; box-shadow: 0 14px 30px rgb(0 0 0 / .4); }

/* Format « mur de cartes » */
#mur { position: absolute; inset: 0; z-index: 5; display: none; background: var(--fond); overflow: hidden; }
#mu-grille { position: absolute; left: 40px; right: 40px; top: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; }
.qc { height: 330px; border-radius: 34px; padding: 30px 26px; display: flex; flex-direction: column; justify-content: center; gap: 12px; text-align: center; background: var(--creme); color: #1B1320; overflow: hidden; }
.qc .k { font-size: 22px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; opacity: .55; }
.qc .v { font-family: var(--titre); font-weight: 600; font-size: 42px; line-height: 1.05; }
.qc .a { font-size: 28px; font-weight: 700; color: #8A5A00; }
#mu-pioche { position: absolute; left: 140px; right: 200px; top: 560px; height: 760px; border-radius: 56px; background: var(--creme); color: #1B1320; display: none; flex-direction: column; justify-content: center; gap: 30px; padding: 50px; text-align: center; box-shadow: 0 50px 120px rgb(0 0 0 / .6); }
#mu-pioche .k { font-size: 36px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; opacity: .55; }
#mu-pioche .v { font-family: var(--titre); font-weight: 600; font-size: 88px; line-height: 1.02; }
#mu-pioche .a { font-size: 64px; font-weight: 800; color: #2B8A3E; }

/* Format « photo » : image réaliste plein écran (étape 4) */
#photo { position: absolute; inset: 0; z-index: 4; display: none; overflow: hidden; background: #000; }
#photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
#photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(rgb(0 0 0 / .55), transparent 35%, transparent 60%, rgb(0 0 0 / .55)); }
#ph-leg { position: absolute; left: 90px; right: 150px; top: 200px; z-index: 2; text-align: center; font-family: var(--titre); font-weight: 600; font-size: 84px; line-height: 1.05; color: #fff; text-shadow: 0 6px 24px rgb(0 0 0 / .7); }
#ph-sous { position: absolute; left: 110px; right: 170px; top: 1230px; z-index: 2; text-align: center; font-family: var(--titre); font-size: 96px; font-weight: 700; color: var(--accent); text-shadow: 0 4px 16px rgb(0 0 0 / .8); }

/* Format « rafale » : questions en série façon jeu télé */
#rafale { position: absolute; inset: 0; z-index: 5; display: none; background: radial-gradient(80% 50% at 50% 45%, #3A1F4D, var(--fond)); }
#ra-score { position: absolute; left: 90px; right: 150px; top: 190px; display: flex; justify-content: space-between; align-items: center; font-size: 46px; font-weight: 800; color: var(--creme); }
#ra-score b { background: var(--accent); color: #1B1320; border-radius: 999px; padding: 10px 30px; }
#ra-barre { position: absolute; left: 90px; right: 150px; top: 290px; height: 18px; border-radius: 9px; background: rgb(255 255 255 / .15); overflow: hidden; }
#ra-barre i { display: block; height: 100%; background: var(--accent); }
#ra-carte { position: absolute; left: 90px; right: 150px; top: 470px; min-height: 520px; border-radius: 56px; background: var(--creme); color: #1B1320; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; padding: 50px; text-align: center; box-shadow: 0 40px 90px rgb(0 0 0 / .5); }
#ra-num { font-size: 36px; font-weight: 800; letter-spacing: .1em; opacity: .5; }
#ra-q { font-family: var(--titre); font-weight: 600; font-size: 76px; line-height: 1.05; }
#ra-r { font-size: 70px; font-weight: 800; color: #2B8A3E; }
#ra-flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }

#vs-vs { position: absolute; left: 540px; top: 870px; translate: -50% -50%; width: 170px; height: 170px; border-radius: 85px; background: var(--fond); border: 10px solid var(--accent); display: grid; place-items: center; font-family: var(--titre); font-weight: 700; font-size: 64px; color: var(--accent); z-index: 2; }

/* Sous-titres (zone sûre) */
#subs { position: absolute; left: 150px; right: 150px; bottom: 385px; z-index: 8; display: flex; justify-content: center; align-items: flex-end; }
#subs .grp { transform-origin: 50% 100%; }
#subs .grp { background: var(--sousTitres); color: var(--creme); border-radius: 28px; padding: 18px 34px; font-weight: 800; font-size: 62px; line-height: 1.12; text-align: center; box-shadow: 0 20px 50px rgb(0 0 0 / .4); }
#subs .now { color: var(--accent); }

/* Carte de fin */
#end { position: absolute; inset: 0; z-index: 7; background: var(--fond); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px; padding-bottom: 280px; }
#end::before { content: ""; position: absolute; inset: 0; background: radial-gradient(60% 40% at 50% 40%, rgb(245 197 24 / .18), transparent 70%); }
#end > * { position: relative; }
#end img { width: 280px; height: 280px; border-radius: 64px; box-shadow: 0 30px 70px rgb(0 0 0 / .45); }
#end h1 { margin: 0; font-family: var(--titre); font-weight: 700; font-size: 132px; letter-spacing: -0.03em; color: var(--accent); }
#end p { margin: 0; font-family: var(--titre); font-weight: 600; font-size: 74px; text-align: center; line-height: 1.05; letter-spacing: -0.02em; }
#end .detail { font-size: 48px; font-weight: 700; opacity: .85; }
#end .pill { background: var(--accent); color: #1B1320; border-radius: 999px; padding: 22px 48px; font-weight: 800; font-size: 46px; }
</style>
</head>
<body>
<div id="stage">
  <div id="brand"><img data-logo alt=""><span>cultureFirst</span></div>
  <div id="camera"><div id="phone"><div id="viewport"><div class="screen" id="screen">
    <div class="island"></div>
    <div class="status" id="status"><span id="heure">9:41</span><span class="bars"><span class="i">&#xf631;</span><b></b></span></div>
    <div class="view" id="v-etude"></div>
    <div class="view" id="v-accueil"></div>
    <div class="view" id="v-catalogue"></div>
    <div class="view" id="v-deck"></div>
    <div class="view" id="v-stats"></div>
    <div class="view" id="v-onboarding"></div>
    <div class="view" id="v-springboard"></div>
    <div class="view" id="v-verrouillage"></div>
    <div class="view" id="v-profil"></div>
    <div id="sheet-bg"></div><div id="sheet"></div>
    <div id="notif"><img data-logo alt=""><div style="flex:1;min-width:0"><div class="nh"><span>CULTURE FIRST</span><span>maintenant</span></div><b id="n-titre"></b><span class="nb" id="n-texte"></span></div></div>
    <div class="tap" id="tap"></div>
    <div class="home-ind" id="homeind"></div>
  </div></div></div></div>
  <div id="bulle" data-texte></div>
  <div id="voile"></div>
  <div id="courbe"><h2>Ta mémoire</h2><div id="retenu" data-texte>Retenu ✓</div><svg id="svg" width="880" height="660"></svg><div id="chips"></div><div class="axe"><span>Aujourd’hui</span><span>Temps →</span></div></div>
  <div id="titre"><div class="num" id="t-num"></div><h2 id="t-texte" data-texte></h2><p id="t-sous" data-texte></p></div>
  <div id="tampon" data-texte></div>
  <div id="chrono"><svg width="230" height="230"><circle cx="115" cy="115" r="100" fill="rgb(18 8 24 / .85)" stroke="rgb(255 255 255 / .15)" stroke-width="14"/><circle id="c-arc" cx="115" cy="115" r="100" fill="none" stroke="#F5C518" stroke-width="14" stroke-linecap="round" transform="rotate(-90 115 115)"/></svg><b id="c-n" data-texte></b></div>
  <div id="chiffre"><b id="ch-n" data-texte></b><span id="ch-sous" data-texte></span></div>
  <div id="chat"><div class="c-head"><span class="c-back">‹</span><span class="c-av" id="c-av"></span><div><b id="c-nom" data-texte></b><small>en ligne</small></div></div><div id="c-fil"></div></div>
  <div id="typo"><div id="ty-bloc"><div id="ty-txt" data-texte><span id="ty-mots"></span><span id="ty-barre"></span></div><div id="ty-cor" data-texte></div><div id="ty-sous" data-texte></div></div></div>
  <div id="monde"><svg id="mo-svg" width="1080" height="1920" preserveAspectRatio="none"><g id="mo-pays"></g></svg><div id="mo-pins"></div><h2 id="mo-titre" data-texte></h2><div id="mo-nom" data-texte></div></div>
  <div id="frise"><h2 id="fr-titre" data-texte></h2><div id="fr-axe"></div><div id="fr-jalons"></div></div>
  <div id="mur"><div id="mu-grille"></div><div id="mu-pioche"><div class="k" data-texte id="mu-k"></div><div class="v" data-texte id="mu-v"></div><div class="a" data-texte id="mu-a"></div></div></div>
  <div id="photo"><img id="ph-img" alt=""><div id="ph-leg" data-texte></div><div id="ph-sous" data-texte></div></div>
  <div id="rafale"><div id="ra-score"><span data-texte id="ra-titre"></span><b data-texte id="ra-pts"></b></div><div id="ra-barre"><i id="ra-prog"></i></div><div id="ra-carte"><div id="ra-num" data-texte></div><div id="ra-q" data-texte></div><div id="ra-r" data-texte></div></div><div id="ra-flash"></div></div>
  <div id="versus"><h2 id="vs-q" data-texte></h2><div class="vs-side" id="vs-g"></div><div id="vs-vs">VS</div><div class="vs-side" id="vs-d"></div></div>
  <div id="subs"></div>
  <div id="end"><img data-logo alt=""><h1>cultureFirst</h1><p id="promesse"></p><div class="detail" id="detail"></div><div class="pill" id="cta"></div></div>
</div>
<script type="module">
import { appliquerCharte, back, camera, carteFin, chargerProjet, clamp, demarrer, ease, lastAction, sousTitres, transformCamera } from "/pipeline/scene.js";
import { DEMO, MUR_DEFAUT, THEMES } from "./demo.js";

const { projet, script, timings, charte, tl } = await chargerProjet();
const $ = (id) => document.getElementById(id);
appliquerCharte(charte, $("stage"));
const A = charte.couleurs.app;
const fin = { promesse: "Retiens enfin<br>ta culture G", detail: "+ de 200 000 questions", cta: "Gratuit · iPhone et Android", ...script.fin };
$("promesse").innerHTML = fin.promesse;
$("detail").textContent = fin.detail;
$("cta").textContent = fin.cta;

// ---------- Données : démo par défaut < script.ecrans < donnees de l'action ecran ----------
const fusion = (a, b) => { const o = { ...a }; for (const [k, v] of Object.entries(b ?? {})) o[k] = v && typeof v === "object" && !Array.isArray(v) && a?.[k] && typeof a[k] === "object" ? fusion(a[k], v) : v; return o; };
const DATA = fusion(DEMO, script.ecrans ?? {});
const CARTES = script.cartes ?? (script.carte ? [script.carte] : []);
const g = (code) => `<span class="i">&#x${code.toString(16)};</span>`;
const th = (nom) => THEMES[nom] ?? { couleur: "#4DB6A8", icone: 0xf110 };
const pluriel = (n, mot) => `${n} ${mot}${n > 1 ? "s" : ""}`;
const nombre = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
const TABS = [["Decks", 0xf3b0, 0xf3af], ["Parcourir", 0xf284, 0xf284], ["Stats", 0xf59c, 0xf59b], ["Profil", 0xf4aa, 0xf4aa]];
const tabbar = (on, vue) => `<div class="tabbar">${TABS.map(([l, o, f], i) => `<div class="${i === on ? "on" : ""}" id="${vue}-tab-${l.toLowerCase()}">${g(i === on ? f : o)}${l}</div>`).join("")}</div>`;
const counts = (c, size = 15) => `<span class="counts" style="font-size:${size}px"><span class="n" style="${c[0] ? "" : "color:var(--a-faint)"}">${c[0]}</span><span class="l">${c[1]}</span><span class="r">${c[2]}</span></span>`;

// ---------- Écrans ----------
const BOUTONS = [["encore", "Encore", "again"], ["difficile", "Difficile", "hard"], ["correct", "Correct", "good"], ["facile", "Facile", "easy"]];
const ECRANS = {
  etude: (d, s) => {
    const c = CARTES[s.carte] ?? CARTES[0] ?? {};
    const tete = `<div class="topbar">${g(0xf24a)}${counts(c.compteurs ?? DATA.accueil.compteurs)}<span class="right">${g(0xf2ce)}${g(0xf143)}</span></div>
      ${d.horsConnexion ? `<div class="offline" id="offline">${g(0xf25b)} Hors connexion · tes réponses seront envoyées plus tard</div>` : ""}`;
    if (s.finSeance) {
      const f = s.finSeance;
      const note = f.palier ? `Palier atteint : ${pluriel(f.palier, "jour")} d’affilée ! 🎉` : f.prochain ? `Encore ${pluriel(f.prochain - f.serie, "jour")} pour atteindre ${pluriel(f.prochain, "jour")}` : "";
      return `<div class="empty"><div class="ic">${g(0xf225)}</div><div class="heading">Terminé pour aujourd’hui !</div>
        <div class="small" style="font-size:15px">${f.cartes} cartes en ${f.minutes} min. Reviens demain pour la suite.</div>
        <div class="badge" id="e-badge"><div class="titleT" style="color:var(--a-learn)">🔥 ${pluriel(f.serie, "jour")}</div>${note ? `<div class="small">${note}</div>` : ""}</div>
        <div class="btn sec" style="align-self:stretch" id="e-retour">Retour aux decks</div>
        <div class="ghost" id="e-plus">${g(0xf31a)} Réviser plus aujourd’hui</div></div>`;
    }
    const iv = c.intervalles ?? { encore: "1 min", difficile: "6 min", correct: "10 min", facile: "4 j" };
    return `${tete}<div id="cardwrap"><div class="face" id="face">
        <div class="tag"><i style="background:${c.couleur ?? th(c.theme).couleur}"></i>${c.paquet}</div>
        <div class="front"><div class="q">${c.question}</div>${c.indiceType ? `<div class="caption">${c.indiceType}</div>` : ""}${c.indice ? `<div class="hint" id="hint">${c.indice}</div>` : ""}</div>
        <div class="back" id="back"><div class="divider"></div><div class="answer" id="answer">${c.reponse}</div>
          ${c.fiche?.length ? `<div class="fiche">${c.fiche.map(([k, v]) => `<div><span>${k}</span><span>${v}</span></div>`).join("")}</div>` : ""}</div>
      </div>
      <div class="answerbar" id="bar"><div class="btn" id="show" style="flex:1">Afficher la réponse</div>
        ${BOUTONS.map(([k, label, col]) => `<div class="rate" id="r-${k}" style="border-color:${A[col]}55;background:${A[col]}10"><small>${iv[k]}</small><b style="color:var(--a-${col})">${label}</b></div>`).join("")}</div></div>`;
  },
  accueil: (d) => `<div class="pad">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; padding-top:16px;">
        <div><div class="small">${DATA.date}</div><div class="display">Aujourd’hui</div></div>
        <div id="a-serie" style="display:flex; align-items:center; gap:4px; background:var(--a-surface); border:1px solid var(--a-border); border-radius:999px; padding:6px 12px; margin-top:4px;"><span style="font-size:15px">🔥</span><b style="color:var(--a-learn); font-size:15px">${d.serie}</b></div>
      </div>
      <div class="card" id="a-carte" style="padding:24px; display:flex; flex-direction:column; gap:16px;">
        <div style="display:flex; text-align:center;" id="a-compteurs">
          ${[["Nouvelles", "new"], ["En cours", "learn"], ["À revoir", "review"]].map(([l, col], i) => `<div style="flex:1"><div class="display" style="color:var(--a-${col})">${d.compteurs[i]}</div><div class="small">${l}</div></div>`).join("")}
        </div>
        <div class="btn" id="a-etudier">${g(0xf4c6)}Étudier</div>
        <div class="small" style="text-align:center">${pluriel(d.etudiees, "carte")} étudiée${d.etudiees > 1 ? "s" : ""} aujourd’hui</div>
        <div class="ghost" id="a-plus">${g(0xf31a)}Réviser plus aujourd’hui</div>
      </div>
      <div><div class="group-title">Mes thèmes</div><div class="list" id="a-themes">
        ${d.themes.map((x, i) => `<div class="row" id="a-theme-${i}"><div class="ico" style="background:${th(x.nom).couleur}1F;color:${th(x.nom).couleur}">${g(th(x.nom).icone)}</div><div class="txt"><div class="t">${x.nom}</div><div class="s">${pluriel(x.decks, "deck")} · ${x.cartes} cartes</div></div>${counts(x.compteurs, 13)}</div>`).join("")}
      </div></div></div>${tabbar(0, "a")}`,
  catalogue: (d, s) => {
    const q = s.recherche;
    const corps = q
      ? `<div><div class="group-title">${pluriel(d.resultats.length, "résultat")}</div><div class="list">${d.resultats.map((r, i) => `<div class="row" id="c-res-${i}"><div class="ico" style="background:${th(r.theme).couleur}1F;color:${th(r.theme).couleur}">${g(th(r.theme).icone)}</div><div class="txt"><div class="t">${r.titre}</div><div class="s">${r.theme} · ${r.sousTheme}${r.cartes ? ` · ${r.cartes} cartes` : ""}</div></div><span class="i chev">&#xf23b;</span></div>`).join("")}</div></div>`
      : `<div style="font-size:16px;color:var(--a-muted)">Choisis un thème, puis ajoute les packs qui t’intéressent à ta collection.</div>
         <div class="list">${Object.keys(THEMES).map((nom, i) => `<div class="row" id="c-theme-${i}"><div class="ico" style="background:${th(nom).couleur}1F;color:${th(nom).couleur}">${g(th(nom).icone)}</div><div class="txt"><div class="t">${nom}</div></div><span class="i chev">&#xf23b;</span></div>`).join("")}</div>`;
    return `<div class="pad"><div style="padding-top:16px"><div class="small">Catalogue</div><div class="display">Parcourir</div></div>
      <div class="search" id="c-recherche"><span class="i" style="font-size:18px;color:var(--a-muted)">&#xf55f;</span>${q ? `<span class="val">${q}</span><span class="caret"></span>` : "Rechercher un pack, un thème…"}</div>
      ${corps}</div>${tabbar(1, "c")}`;
  },
  deck: (d, s) => `<div class="topbar" style="font-size:24px">${g(0xf229)}<span class="heading">Deck</span><span style="width:24px"></span></div>

// ---------- État de l'écran à l'instant t ----------
const avant = (t) => tl.actions.filter((a) => a.t <= t);
function etat(t) {
  const acts = avant(t);
  const ecrans = acts.filter((a) => a.type === "ecran");
  const courant = ecrans.at(-1) ?? { nom: script.ecranInitial ?? "etude", t: -10 };
  const precedent = ecrans.at(-2) ?? (ecrans.length ? { nom: script.ecranInitial ?? "etude", t: -10 } : null);
  const s = { courant, precedent, carte: 0, carteT: -10, finSeance: null, recherche: "", ajoute: false, etape: DATA.onboarding.etape, choisis: [...DATA.onboarding.choisis], rythme: DATA.onboarding.rythme, rappel: DATA.onboarding.rappel };
  for (const a of acts) {
    if (a.type === "carte") { s.carte = a.index; s.carteT = a.t; s.finSeance = null; }
    else if (a.type === "finSeance") s.finSeance = fusion(DATA.finSeance, a.donnees);
    else if (a.type === "saisir") { const p = clamp((t - a.t) / Math.max(0.05, (a.t2 ?? a.t + 0.08 * a.texte.length) - a.t)); s.recherche = a.texte.slice(0, Math.ceil(p * a.texte.length)); }
    else if (a.type === "effacer") s.recherche = "";
    else if (a.type === "ajouter") s.ajoute = true;
    else if (a.type === "etape") s.etape = a.n;
    else if (a.type === "choisir") {
      if (s.etape === 1) s.choisis = s.choisis.includes(a.valeur) ? s.choisis.filter((x) => x !== a.valeur) : [...s.choisis, a.valeur];
      else if (s.etape === 2) s.rythme = a.valeur;
      else if (s.etape === 3) s.rappel = a.valeur;
    }
  }
  const rev = acts.filter((a) => a.type === "reveler").at(-1);
  const reset = acts.filter((a) => a.type === "recto" || a.type === "carte" || a.type === "finSeance").at(-1);
  s.revele = rev && (!reset || rev.t > reset.t) ? rev : null;
  return s;
}

// Rendu d'une vue (reconstruit seulement quand ses données ou son état changent).
const cache = {};
function construire(nom, ecranAction, s) {
  const d = fusion(DATA[nom] ?? {}, ecranAction?.donnees);
  const html = ECRANS[nom](d, s);
  if (cache[nom] !== html) {
    $(`v-${nom}`).innerHTML = html;
    $(`v-${nom}`).querySelectorAll("img[data-logo]").forEach((img) => (img.src = "/" + charte.logo));
    cache[nom] = html;
  }
}

// Position d'un élément de l'écran, en points de l'écran (indépendante de la caméra).
function posEcran(el) {
  const r = el.getBoundingClientRect(), sr = $("screen").getBoundingClientRect();
  const k = sr.width / 393;
  return { x: (r.left - sr.left + r.width / 2) / k, y: (r.top - sr.top + r.height / 2) / k, w: r.width / k, h: r.height / k };
}
const versScene = (p) => ({ x: 107 + 2.2 * p.x, y: 406 + 2.2 * p.y });

// ---------- Caméra : presets, ou id d'un élément de l'écran ----------
const PRESETS = {
  aucun: { s: 1, x: 540, y: 960, cx: 540, cy: 960 },
  entier: { s: 0.8, x: 540, y: 1343, cx: 540, cy: 1060 },
  carte: { s: 1.15, x: 540, y: 1100, cx: 540, cy: 900 },
  boutons: { s: 1.15, x: 540, y: 1761, cx: 540, cy: 1180 },
};
function cibleCamera(a) {
  if (PRESETS[a.cible]) return PRESETS[a.cible];
  const el = $(a.cible);
  if (!el) return PRESETS.aucun;
  const p = versScene(posEcran(el));
  return { s: a.echelle ?? 1.3, x: p.x, y: p.y, cx: 540, cy: a.hauteur ?? 900 };
}

// ---------- Courbe de mémoire ----------
const GW = 780, GH = 600;
const yOf = (m) => 40 + (1 - m) * (GH - 80);
const XR = [0.17, 0.37, 0.64].map((f) => f * GW);
const STAB = [0.07, 0.13, 0.3, 3].map((f) => f * GW);
const oubli = (x) => 0.1 + 0.9 * Math.exp(-x / (GW * 0.2));
// Révisions placées selon leur nombre (1 à 3) ; le dernier segment décroît très lentement.
const XRN = { 1: [0.3 * GW], 2: [0.2 * GW, 0.48 * GW], 3: XR };
const memoire = (x, n = 3) => { const xr = XRN[n]; let k = 0; while (k < xr.length && x >= xr[k]) k++; const x0 = k ? xr[k - 1] : 0; return 0.1 + 0.9 * Math.exp(-(x - x0) / (k === n ? STAB[3] : STAB[k])); };
const trace = (f, x0, x1) => { let d = ""; for (let x = x0; x <= x1 + 1e-6; x += 4) d += `${d ? "L" : "M"}${x.toFixed(1)},${yOf(f(Math.min(x, x1))).toFixed(1)}`; return d; };
function dessinerCourbe(t, courbe) {
  const svg = $("svg"), chips = $("chips");
  const axes = `<path d="M0,20 V${GH} H${GW + 40}" fill="none" stroke="#CFC6D3" stroke-width="5" stroke-linecap="round"/>`;
  if (courbe.mode === "oubli") {
    const p = ease(clamp((t - courbe.t) / Math.max(0.3, (courbe.t2 ?? courbe.t + 1.5) - courbe.t)));
    svg.innerHTML = axes + (p > 0 ? `<path d="${trace(oubli, 0, p * GW)}" fill="none" stroke="#E03131" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>` : "");
    chips.innerHTML = "";
    $("retenu").style.opacity = 0;
    return;
  }
  const revs = tl.actions.filter((a) => a.type === "revision" && a.t >= courbe.t).slice(0, 3);
  const anc = tl.actions.find((a) => a.type === "ancrage" && a.t >= courbe.t);
  const debuts = [courbe.t, ...revs.map((r) => r.t)];
  const fins = [...revs.map((r) => r.t), anc ? anc.t2 : courbe.t + 6];
  const n = Math.max(1, revs.length), xr = XRN[n];
  const bornes = [0, ...xr, GW];
  const mem = (x) => memoire(x, n);
  let d = "";
  for (let k = 0; k <= revs.length; k++) {
    if (t < debuts[k]) break;
    const p = ease(clamp((t - debuts[k]) / Math.max(0.2, fins[k] - debuts[k])));
    const seg = trace(mem, bornes[k] + (k ? 0.01 : 0), bornes[k] + (bornes[k + 1] - bornes[k]) * p);
    d += k ? seg.replace(/^M/, "L") : seg;
  }
  const fantome = `<path d="${trace(oubli, 0, GW)}" fill="none" stroke="#E03131" stroke-opacity=".25" stroke-width="8" stroke-dasharray="4 18" stroke-linecap="round"/>`;
  const points = revs.map((r, k) => (t < r.t ? "" : `<circle cx="${xr[k]}" cy="${yOf(1)}" r="${16 * back(clamp((t - r.t) / 0.4))}" fill="#F5C518" stroke="#1B1320" stroke-width="5"/>`)).join("");
  svg.innerHTML = axes + fantome + `<path d="${d}" fill="none" stroke="#2B8A3E" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>` + points;
  chips.innerHTML = revs.map((r, k) => {
    if (t < r.t) return "";
    const q = back(clamp((t - r.t) / 0.4));
    return `<div class="chip-or" data-texte style="left:${50 + xr[k]}px; top:${270 + yOf(1) - 100}px; transform:translateY(${(1 - q) * 30}px) scale(${q})">${r.label}</div>`;
  }).join("");
  const ok = anc && t >= anc.t2;
  $("retenu").style.opacity = ok ? clamp((t - anc.t2) / 0.3) : 0;
  $("retenu").style.transform = ok ? `scale(${back(clamp((t - anc.t2) / 0.4))})` : "";
}

// Superposition active : de son action jusqu'à masquer / fin / la suivante du même type / sa durée.
function actif(type, t, stops = []) {
  const a = lastAction(tl, type, t);
  if (!a) return null;
  const fins = tl.actions.filter((x) => x.t > a.t && (x.type === type || x.type === "masquer" || x.type === "fin" || stops.includes(x.type))).map((x) => x.t);
  if (a.t2 !== undefined && a.type !== "courbe") fins.push(a.t2);
  else if (type === "notif" || type === "tampon") fins.push(a.t + 4);
  const stop = Math.min(Infinity, ...fins);
  if (t >= stop + 0.3) return null;
  return { a, pIn: clamp((t - a.t) / 0.45), pOut: t > stop ? clamp((t - stop) / 0.3) : 0 };
}

const subs = sousTitres(timings);
// Typographie française : espace insécable avant ? ! : ; » et après «.
const fr = (x) => (x ?? "").replace(/ ([?!:;»])/g, "\u00a0$1").replace(/« /g, "«\u00a0");
const VUES = Object.keys(ECRANS);

// ---------- Rendu d'une image à l'instant t (déterministe) ----------
function renderAt(t) {
  const s = etat(t);

  // Vues : la courante glisse par-dessus la précédente.
  const pv = ease(clamp((t - s.courant.t) / 0.35));
  for (const nom of VUES) {
    const v = $(`v-${nom}`);
    const estCourant = nom === s.courant.nom, estPrec = s.precedent && nom === s.precedent.nom && pv < 1 && !estCourant;
    if (estCourant || estPrec || !cache[nom]) construire(nom, estCourant ? s.courant : estPrec ? s.precedent : null, s);
    v.style.visibility = estCourant || estPrec ? "visible" : "hidden";
    v.style.zIndex = estCourant ? 2 : 1;
    v.style.transform = estCourant ? `translateX(${(1 - pv) * 60}px)` : "";
    v.style.opacity = estCourant ? pv : 1;
  }
  // Défilement (action defiler, en points d'écran), remis à zéro à chaque changement d'écran.
  const def = lastAction(tl, "defiler", t);
  const dy = def && def.t > s.courant.t ? (def.depart ?? 0) + ((def.y ?? 0) - (def.depart ?? 0)) * ease(clamp((t - def.t) / 0.7)) : 0;
  const contenu = $(`v-${s.courant.nom}`).querySelector(".pad");
  if (contenu) contenu.style.transform = dy ? `translateY(${-dy}px)` : "";
  const sombre = ["springboard", "verrouillage"].includes(s.courant.nom);
  $("status").style.color = sombre ? "#fff" : "";
  $("homeind").style.background = sombre ? "#fff" : "#111";
  $("heure").textContent = s.courant.nom === "verrouillage" ? "" : s.courant.nom === "springboard" ? fusion(DATA.springboard, s.courant.donnees).heure : "9:41";

  // Étude : carte courante, réponse, appuis.
  if (s.courant.nom === "etude" && !s.finSeance) {
    const pc = s.carteT > 0 ? ease(clamp((t - s.carteT) / 0.35)) : 1;
    $("face").style.transform = `translateX(${(1 - pc) * 420}px)`;
    const pr = s.revele ? clamp((t - s.revele.t) / 0.35) : 0;
    $("back").style.display = s.revele ? "flex" : "none";
    $("back").style.opacity = pr;
    $("answer").style.transform = `scale(${0.7 + 0.3 * back(pr)})`;
    $("show").style.display = s.revele ? "none" : "flex";
    const note = lastAction(tl, "noter", t);
    for (const [k, , col] of BOUTONS) {
      const el = $(`r-${k}`);
      el.style.display = s.revele ? "flex" : "none";
      const actifNote = note && s.revele && note.t >= s.revele.t && note.bouton === k;
      el.style.background = A[col] + (actifNote ? "33" : "10");
      el.style.transform = actifNote && t - note.t < 0.3 ? `scale(${1 - 0.08 * Math.sin(Math.PI * (t - note.t) / 0.3)})` : "";
    }
  }

  // Appui (rond) : sur reveler (bouton « Afficher la réponse »), noter, appui, ajouter, choisir.
  const tap = $("tap");
  tap.style.display = "none";
  const appuis = tl.actions.filter((a) => ["reveler", "noter", "appui", "ajouter", "choisir"].includes(a.type));
  const ap = appuis.find((a) => (a.type === "reveler" ? t >= a.t - 0.25 && t < a.t : t >= a.t && t < a.t + 0.45));
  if (ap) {
    const id = ap.type === "reveler" ? "show" : ap.type === "noter" ? `r-${ap.bouton}` : ap.type === "ajouter" ? "d-ajouter" : ap.type === "choisir" ? idChoix(ap, s) : ap.cible;
    const el = id && $(id);
    if (el && el.offsetParent !== null) {
      const p = posEcran(el);
      const q = ap.type === "reveler" ? 1 - (ap.t - t) / 0.25 : clamp((t - ap.t) / 0.45);
      Object.assign(tap.style, { display: "block", left: `${p.x}px`, top: `${p.y}px`, opacity: ap.type === "reveler" ? q : 1 - q, transform: `scale(${0.6 + 0.8 * q})` });
      if (ap.type === "appui" || ap.type === "reveler") el.style.transform = `scale(${1 - 0.05 * Math.sin(Math.PI * clamp(q))})`;
    }
  }

  // Feuille « Réviser plus » et notification.
  const feuille = actif("feuille", t, ["fermer", "ecran"]);
  $("sheet-bg").style.display = $("sheet").style.display = feuille ? "flex" : "none";
  if (feuille) {
    if (!$("sheet").dataset.ok) {
      $("sheet").dataset.ok = 1;
      $("sheet").innerHTML = `<div class="grab"></div><div class="titleT">Réviser plus aujourd’hui</div>
        <div class="presets">${[5, 10, 20].map((n) => `<div class="preset" id="f-plus-${n}">+${n}<span class="small" style="font-weight:400">nouvelles</span></div>`).join("")}</div>
        <div class="list"><div class="row"><div class="txt"><div class="t">Nouvelles cartes en plus</div><div class="s">Cartes jamais vues de tes decks</div></div></div><div class="row"><div class="txt"><div class="t">Révisions en plus</div><div class="s">Utile si tu as atteint ta limite de révisions</div></div></div></div>
        <div><div class="group-title">Autres façons d’étudier</div><div class="list">
          <div class="row" id="f-erreurs"><div class="ico" style="background:var(--a-alt)">${g(0xf518)}</div><div class="txt"><div class="t">Revoir mes erreurs du jour</div><div class="s">Les cartes où tu as répondu « Encore » aujourd’hui</div></div><span class="i chev">&#xf23b;</span></div>
          <div class="row" id="f-avance"><div class="ico" style="background:var(--a-alt)">${g(0xf1d6)}</div><div class="txt"><div class="t">Réviser en avance</div><div class="s">Les cartes prévues dans les 3 prochains jours (avant un voyage…)</div></div><span class="i chev">&#xf23b;</span></div>
        </div></div>`;
    }
    const p = ease(feuille.pIn) * (1 - feuille.pOut);
    $("sheet").style.transform = `translateY(${(1 - p) * 720}px)`;
    $("sheet-bg").style.opacity = p;
  }
  const notif = actif("notif", t);
  const n = $("notif");
  n.style.display = notif ? "flex" : "none";
  if (notif) {
    $("n-titre").textContent = notif.a.titre;
    $("n-texte").textContent = notif.a.texte;
    const p = back(clamp((t - notif.a.t) / 0.5)) * (1 - notif.pOut);
    n.style.transform = `translateY(${(1 - p) * -140 + (s.courant.nom === "verrouillage" ? 170 : 0)}px)`;
  }

  // Caméra (après la mise à jour de l'écran : les cibles suivent la mise en page).
  const entree = lastAction(tl, "entree", t);
  const pin = entree ? back(clamp((t - entree.t) / 0.7)) : 0;
  const cam = camera(tl, t, cibleCamera, ["ecran"]);
  $("camera").style.transform = `translateY(${(1 - pin) * 1700}px) ${transformCamera(cam)}`;
  const chronoVisible = tl.actions.some((a) => a.type === "chrono" && t >= a.t - 0.2 && t < a.t + a.secondes + 0.4);
  const formatVisible = FORMATS.some((k) => actif(k, t, ARRETS));
  $("brand").style.opacity = clamp(1 - (cam.s - 1) * 8) * (cam.s < 0.95 || chronoVisible || formatVisible ? 0 : 1);

  // Bulle de réponse spontanée : barrée (rate) ou validée (juste) ; part à la révélation.
  const bulle = lastAction(tl, "bulle", t);
  const b = $("bulle");
  const finBulle = bulle && tl.actions.find((a) => a.t > bulle.t && ["reveler", "masquer", "carte", "bulle", "ecran"].includes(a.type));
  const sortie = finBulle && t > finBulle.t ? clamp((t - finBulle.t) / 0.25) : 0;
  if (bulle && sortie < 1) {
    const verdict = tl.actions.filter((a) => (a.type === "rate" || a.type === "juste") && a.t >= bulle.t && a.t <= t && (!finBulle || a.t <= finBulle.t)).at(-1);
    const secoue = verdict?.type === "rate" ? Math.sin((t - verdict.t) * 50) * 14 * (1 - clamp((t - verdict.t) / 0.4)) : 0;
    b.style.display = "block";
    b.style.opacity = 1 - sortie;
    b.style.transform = `translateX(${secoue}px) rotate(-4deg) scale(${back(clamp((t - bulle.t) / 0.4)) * (1 - 0.2 * sortie)})`;
    const bt = fr(bulle.texte);
    b.innerHTML = verdict?.type === "rate" ? `<s>${bt}</s><span class="x">✕</span>` : verdict?.type === "juste" ? `${bt}<span class="ok">✓</span>` : bt;
    // Bulle longue : décalée vers la gauche pour rester dans la zone sûre (bord droit à 900 px).
    b.style.left = `${Math.max(90, Math.min(330, 900 - b.offsetWidth))}px`;
  } else b.style.display = "none";

  // Courbe, titre, chiffre (sur voile) ; tampon et chrono (sans voile).
  let voile = 0;
  const courbe = actif("courbe", t, ["titre", "chiffre", "ecran"]);
  $("courbe").style.display = courbe ? "block" : "none";
  if (courbe) {
    const pIn = back(clamp((t - courbe.a.t + 0.25) / 0.5));
    $("courbe").style.opacity = 1 - courbe.pOut;
    $("courbe").style.transform = `translateY(${(1 - pIn) * 300 + courbe.pOut * 200}px) scale(${0.9 + 0.1 * pIn})`;
    voile = Math.max(voile, 0.65 * clamp((t - courbe.a.t + 0.25) / 0.3) * (1 - courbe.pOut));
    dessinerCourbe(t, courbe.a);
  }
  const titre = actif("titre", t, ["courbe", "chiffre", "ecran"]);
  $("titre").style.display = titre ? "flex" : "none";
  if (titre) {
    const q = back(titre.pIn);
    $("t-num").style.display = titre.a.numero ? "grid" : "none";
    $("t-num").textContent = titre.a.numero ?? "";
    $("t-texte").innerHTML = fr(titre.a.texte);
    $("t-sous").innerHTML = fr(titre.a.sous);
    $("t-sous").style.display = titre.a.sous ? "block" : "none";
    $("titre").style.opacity = clamp(titre.pIn * 2) * (1 - titre.pOut);
    $("titre").style.transform = `translateY(${(1 - q) * 160 + titre.pOut * 120}px) scale(${0.92 + 0.08 * q})`;
    voile = Math.max(voile, 0.7 * clamp(titre.pIn * 2) * (1 - titre.pOut));
  }
  const chiffre = actif("chiffre", t, ["courbe", "titre", "ecran"]);
  $("chiffre").style.display = chiffre ? "flex" : "none";
  if (chiffre) {
    const a = chiffre.a, p = ease(clamp((t - a.t) / (a.montee ?? 1.2)));
    $("ch-n").innerHTML = (a.prefixe ? `<small>${a.prefixe}</small>` : "") + nombre(Math.round((a.depart ?? 0) + (a.valeur - (a.depart ?? 0)) * p)) + (a.suffixe ? `<small>${a.suffixe}</small>` : "");
    $("ch-sous").innerHTML = fr(a.sous);
    $("chiffre").style.opacity = clamp(chiffre.pIn * 2) * (1 - chiffre.pOut);
    $("chiffre").style.transform = `scale(${0.85 + 0.15 * back(chiffre.pIn)})`;
    voile = Math.max(voile, 0.93 * clamp(chiffre.pIn * 2) * (1 - chiffre.pOut));
  }
  $("voile").style.opacity = voile;
  const tampon = actif("tampon", t, ["ecran", "carte", "titre", "courbe", "chiffre", "vue", "devoiler", "entree", ...FORMATS]);
  $("tampon").style.display = tampon ? "block" : "none";
  if (tampon) {
    const col = { rouge: A.again, vert: A.good, or: charte.couleurs.accent }[tampon.a.couleur ?? "rouge"] ?? tampon.a.couleur;
    const q = clamp((t - tampon.a.t) / 0.18);
    $("tampon").textContent = fr(tampon.a.texte);
    // Taille adaptée : le tampon (incliné) tient dans la zone sûre.
    $("tampon").style.fontSize = "170px";
    const largeur = $("tampon").offsetWidth;
    if (largeur > 700) $("tampon").style.fontSize = `${Math.floor(170 * 700 / largeur)}px`;
    // Départ « plaqué » : grossi, mais jamais plus large que la zone sûre (880 px).
    const depart = Math.min(2.2, 800 / Math.max(1, $("tampon").offsetWidth * 0.99 + $("tampon").offsetHeight * 0.16));
    Object.assign($("tampon").style, { color: col, borderColor: col, opacity: Math.min(q * 2, 1) * (1 - tampon.pOut), transform: `rotate(-9deg) scale(${depart - (depart - 1) * ease(q)})` });
  }
  const chrono = lastAction(tl, "chrono", t);
  const finChrono = chrono && chrono.t + chrono.secondes;
  $("chrono").style.display = chrono && t < finChrono + 0.4 ? "block" : "none";
  if (chrono && t < finChrono + 0.4) {
    const reste = Math.max(0, finChrono - t);
    $("c-n").textContent = Math.ceil(reste) || "0";
    const C = 2 * Math.PI * 100;
    $("c-arc").setAttribute("stroke-dasharray", `${C * (reste / chrono.secondes)} ${C}`);
    $("chrono").style.opacity = t > finChrono ? 1 - clamp((t - finChrono) / 0.4) : clamp((t - chrono.t) / 0.2);
    $("chrono").style.transform = `scale(${1 + 0.08 * Math.max(0, 1 - ((finChrono - t) % 1) * 5)})`;
  }

  formats(t);
  formats2(t);
  subs($("subs"), t);
  carteFin(tl, $("end"), t);
}

// ---------- Formats plein écran : messagerie et face-à-face ----------
function miniCarte(c) {
  return `<div class="mini"><div class="tg">● ${c.paquet}</div><div class="q">${c.question}</div>${c.indice ? `<div class="h">${c.indice}</div>` : ""}<hr><div class="r">${c.reponse}</div><div class="src">Culture First</div></div>`;
}
function formats(t) {
  // Messagerie : du `chat` jusqu'à masquer / fin / ecran / versus.
  const chat = actif("chat", t, ARRETS);
  $("chat").style.display = chat ? "flex" : "none";
  if (chat) {
    const p = back(chat.pIn);
    $("chat").style.opacity = clamp(chat.pIn * 2) * (1 - chat.pOut);
    $("chat").style.transform = `translateY(${(1 - p) * 200}px) scale(${0.94 + 0.06 * p})`;
    $("c-nom").textContent = chat.a.contact ?? "Thomas";
    $("c-av").textContent = chat.a.avatar ?? "🙂";
    const msgs = tl.actions.filter((a) => (a.type === "message" || a.type === "messageCarte") && a.t >= chat.a.t && a.t <= t);
    const reacs = tl.actions.filter((a) => a.type === "reaction" && a.t >= chat.a.t && a.t <= t);
    const prochain = tl.actions.find((a) => a.type === "message" && a.de === "lui" && a.ecrit !== false && a.t > t && a.t - t < 0.9 && a.t >= chat.a.t);
    let html = msgs.map((m, i) => {
      const q = back(clamp((t - m.t) / 0.3));
      const r = reacs.filter((x) => msgs.filter((y) => y.t <= x.t).at(-1) === m).at(-1);
      const reac = r ? `<span class="reac" style="transform:scale(${back(clamp((t - r.t) / 0.3))})">${r.emoji}</span>` : "";
      const de = m.de === "lui" ? "lui" : "moi";
      const vocal = m.vocal ? `<span style="display:inline-flex;align-items:center;gap:6px">▶︎ ${Array.from({ length: 22 }, (_, k) => `<i style="display:inline-block;width:6px;border-radius:3px;background:currentColor;height:${14 + 40 * Math.abs(Math.sin(k * 1.7))}px;opacity:${k / 22 < clamp((t - m.t) / 1.5) ? 1 : 0.4}"></i>`).join("")} <small style="font-size:32px;opacity:.8">${m.vocal}</small></span>` : "";
      const nom = m.nom ? `<div style="font-size:28px;font-weight:700;color:#8E8E93;margin:-4px 0 6px">${m.nom}</div>` : "";
      const corps = m.type === "messageCarte" ? miniCarte(CARTES[m.index ?? 0] ?? {}) : nom + (vocal || fr(m.texte));
      return `<div class="msg ${de} ${m.type === "messageCarte" ? "carte" : ""}" data-texte style="transform:scale(${0.6 + 0.4 * q});opacity:${clamp(q * 1.5)}">${corps}${reac}</div>`;
    }).join("");
    if (prochain) html += `<div class="typing">${[0, 1, 2].map((k) => `<i style="opacity:${0.35 + 0.65 * Math.max(0, Math.sin((t * 6 - k * 0.8) % (2 * Math.PI)))}"></i>`).join("")}</div>`;
    $("c-fil").innerHTML = html;
  }

  // Face-à-face : deux camps, verdict (le gagnant prend la couronne, l'autre s'efface).
  const vs = actif("versus", t, ARRETS);
  $("versus").style.display = vs ? "block" : "none";
  if (vs) {
    const a = vs.a;
    $("versus").style.opacity = clamp(vs.pIn * 2) * (1 - vs.pOut);
    $("vs-q").innerHTML = fr(a.question ?? "");
    const verdict = tl.actions.filter((x) => x.type === "verdict" && x.t >= a.t && x.t <= t).at(-1);
    const pv = verdict ? clamp((t - verdict.t) / 0.5) : 0;
    for (const [cote, el, dx] of [["gauche", $("vs-g"), -1], ["droite", $("vs-d"), 1]]) {
      const d = a[cote] ?? {};
      const gagne = verdict && verdict.cote === cote, perd = verdict && verdict.cote !== cote && verdict.cote !== "egalite";
      el.innerHTML = `<span class="emo">${d.emoji ?? ""}</span><b data-texte>${fr(d.titre ?? "")}</b><small data-texte>${verdict ? fr(d.info ?? "") : fr(d.sous ?? "")}</small>${gagne ? `<span class="ok" style="transform:scale(${back(pv)})">✓</span>` : ""}`;
      // Titre long : réduit pour tenir dans le panneau.
      const tb = el.querySelector("b");
      if (tb.scrollWidth > tb.clientWidth + 1) tb.style.fontSize = `${Math.floor(66 * tb.clientWidth / tb.scrollWidth)}px`;
      // Entrée en zoom depuis le centre du panneau : jamais hors de la zone sûre.
      const e = ease(clamp((t - a.t - (cote === "droite" ? 0.15 : 0)) / 0.45));
      el.style.transform = `scale(${(0.8 + 0.2 * e) * (1 + (gagne ? 0.03 : perd ? -0.06 : 0) * pv)})`;
      el.style.opacity = e;
      el.style.filter = perd ? `grayscale(${pv}) brightness(${1 - 0.45 * pv})` : "";
    }
    const tremble = verdict ? 0 : Math.sin(t * 9) * 4;
    $("vs-vs").style.transform = `rotate(${tremble}deg) scale(${back(clamp((t - a.t - 0.3) / 0.4)) * (verdict ? 1 - 0.3 * pv : 1)})`;
  }
}

// ---------- Formats plein écran (suite) : typographie, carte du monde, frise, mur de cartes, photo, rafale ----------
// Chaque format dure de son action jusqu'au format suivant, à `ecran`, `entree`, `masquer` ou `fin`.
const FORMATS = ["chat", "versus", "typo", "monde", "frise", "mur", "photo", "rafale"];
const ARRETS = [...FORMATS, "ecran", "entree"];
const apres = (type, debut, t) => tl.actions.filter((x) => x.type === type && x.t >= debut && x.t <= t);
const COULEURS = { rouge: "#FF4D4D", vert: "#51CF66", or: "#F5C518", bleu: "#4DABF7" };

// Typographie : texte géant mot à mot ; *mot* en or ; barrer / corriger.
function typo(t) {
  const ty = actif("typo", t, ARRETS);

  $("ty-txt").style.fontSize = `${taille}px`;
  $("ty-mots").innerHTML = texte.split(/ +/).map((w, i) => {
    const q = back(clamp((t - a.t - i * 0.07) / 0.3));
    const em = w.startsWith("*") && w.replace(/[.,!?… ]+$/, "").endsWith("*");
    const txt = w.replace(/\*/g, "");
    return `<span class="w" style="opacity:${clamp(q * 1.5)};transform:translateY(${(1 - q) * 40}px) scale(${0.8 + 0.2 * q})">${em ? `<em>${txt}</em>` : txt}</span>`;
  }).join(" ");
  const barre = apres("barrer", a.t, t).at(-1);

  const cor = apres("corriger", a.t, t).at(-1);
  const pc = cor ? back(clamp((t - cor.t) / 0.45)) : 0;
  $("ty-cor").innerHTML = cor ? fr(cor.texte) : "";
  $("ty-cor").style.fontSize = `${Math.round(taille * 0.9)}px`;
  $("ty-cor").style.transform = `translateY(${(1 - pc) * -120}px)`;
  $("ty-cor").style.opacity = clamp(pc * 1.5);
  $("ty-sous").innerHTML = fr(a.sous ?? "");
  $("ty-sous").style.opacity = 0.85 * clamp((t - a.t - 0.5) / 0.3);
}

// Carte du monde (Natural Earth 110m, projection de Mercator).
const MONDE = await (async () => {
  if (!tl.actions.some((a) => a.type === "monde")) return null;
  const topo = await fetch("geo/countries-110m.json").then((r) => r.json());
  const feats = topojson.feature(topo, topo.objects.countries).features.filter((f) => f.properties.name !== "Antarctica");
  const R = 3600 / (2 * Math.PI);
  const Y0 = R * Math.log(Math.tan(Math.PI / 4 + (84 * Math.PI) / 360));
  const proj = ([lon, lat]) => [(lon + 180) * 10, Y0 - R * Math.log(Math.tan(Math.PI / 4 + (Math.max(-80, Math.min(84, lat)) * Math.PI) / 360))];
  const pays = {};
  const g = $("mo-pays");
  feats.forEach((f, i) => {
    const geom = f.geometry;
    const polys = geom.type === "Polygon" ? [geom.coordinates] : geom.type === "MultiPolygon" ? geom.coordinates : [];
    let d = "";
    const boites = [];
    for (const poly of polys) {
      const bb = [1e9, 1e9, -1e9, -1e9];
      for (const ring of poly) {
        let prev = null;
        ring.forEach((pt, k) => {
          const [x, y] = proj(pt);
          d += `${k === 0 || (prev && Math.abs(pt[0] - prev[0]) > 180) ? "M" : "L"}${x.toFixed(1)},${y.toFixed(1)}`;
          prev = pt;
          bb[0] = Math.min(bb[0], x); bb[1] = Math.min(bb[1], y); bb[2] = Math.max(bb[2], x); bb[3] = Math.max(bb[3], y);
        });
        d += "Z";
      }
      boites.push(bb);
    }
    const el = document.createElementNS("http://www.w3.org/2000/svg", "path");
    el.setAttribute("d", d);
    el.setAttribute("stroke", "#170B20");
    el.setAttribute("stroke-width", "1.5");
    el.setAttribute("vector-effect", "non-scaling-stroke");
    g.append(el);
    const principale = boites.reduce((m, b) => ((b[2] - b[0]) * (b[3] - b[1]) > (m[2] - m[0]) * (m[3] - m[1]) ? b : m), boites[0]);
    pays[f.properties.name] = { el, boites, principale };
  });
  return { pays, proj };
})();

// Boîte de vue (9:16) d'une action : pays (contour principal, ou entier), ou centre + largeur en degrés.
function vueMonde(v) {
  if (!v) return null;
  let bb;
  if (v.pays) {
    bb = [1e9, 1e9, -1e9, -1e9];
    for (const nom of [].concat(v.pays)) {
      const p = MONDE.pays[nom];
      if (!p) continue;
      for (const b of v.entier ? p.boites : [p.principale]) { bb[0] = Math.min(bb[0], b[0]); bb[1] = Math.min(bb[1], b[1]); bb[2] = Math.max(bb[2], b[2]); bb[3] = Math.max(bb[3], b[3]); }
    }
  } else {
    const [x, y] = MONDE.proj(v.centre ?? [0, 20]);
    const w = (v.largeur ?? 360) * 10;
    bb = [x - w / 2, y - w / 2, x + w / 2, y + w / 2];
  }
  const marge = v.marge ?? 0.25;
  let w = (bb[2] - bb[0]) * (1 + 2 * marge), h = (bb[3] - bb[1]) * (1 + 2 * marge);
  const r = 1080 / 1920;
  if (w / h > r) h = w / r; else w = h * r;
  const cx = (bb[0] + bb[2]) / 2, cy = (bb[1] + bb[3]) / 2 + h * (v.decalage ?? 0);
  return [cx - w / 2, cy - h / 2, w, h];
}

function monde(t) {
  const mo = actif("monde", t, ARRETS);
  $("monde").style.display = mo ? "block" : "none";
  if (!mo || !MONDE) return;
  const a = mo.a;
  $("monde").style.opacity = clamp(mo.pIn * 2) * (1 - mo.pOut);
  // Caméra : chaque action monde / vue / silhouette / devoiler avec une vue déplace la boîte (0,9 s).
  const cams = [a, ...tl.actions.filter((x) => ["vue", "silhouette", "devoiler"].includes(x.type) && x.t > a.t && x.t <= t)];
  let from = vueMonde(a.vue ?? { centre: [0, 20], largeur: 360 }), to = from, t0 = a.t;
  for (const c of cams.slice(1)) {
    const cible = vueMonde(c.vue ?? (c.pays && c.type === "silhouette" ? { pays: c.pays, marge: 0.2 } : null));
    if (!cible) continue;
    const p = ease(clamp((c.t - t0) / 0.9));
    from = from.map((v, i) => v + (to[i] - v) * p);
    to = cible;
    t0 = c.t;
  }
  const p = ease(clamp((t - t0) / 0.9));
  const vb = from.map((v, i) => v + (to[i] - v) * p);
  $("mo-svg").setAttribute("viewBox", vb.map((v) => v.toFixed(1)).join(" "));
  const sil = apres("silhouette", a.t, t).at(-1);
  const dev = apres("devoiler", a.t, t).at(-1);
  const masque = sil && (!dev || dev.t < sil.t) ? 1 : sil && dev ? 1 - clamp((t - dev.t) / 0.6) : 0;
  const teintes = {};
  for (const s of apres("surligner", a.t, t)) for (const nom of [].concat(s.pays)) teintes[nom] = [COULEURS[s.couleur] ?? s.couleur ?? COULEURS.or, clamp((t - s.t) / 0.4)];
  if (sil) teintes[sil.pays] = [COULEURS.or, 1];
  for (const [nom, p2] of Object.entries(MONDE.pays)) {
    const tt = teintes[nom];
    p2.el.setAttribute("fill", tt ? mix("#4A2D5E", tt[0], tt[1]) : "#4A2D5E");
    p2.el.setAttribute("opacity", tt ? 1 : (1 - masque).toFixed(3));
  }
  $("mo-titre").innerHTML = fr(a.titre ?? "");
  const nomVisible = dev && (!sil || sil.t < dev.t);
  $("mo-nom").innerHTML = nomVisible && dev.nom ? fr(dev.nom) : "";
  $("mo-nom").style.transform = dev ? `scale(${back(clamp((t - dev.t) / 0.4))})` : "";
  // Épingles : celles posées depuis le dernier déplacement de la carte, et seulement si elles sont à l'écran.
  const derniereVue = Math.max(a.t, ...apres("vue", a.t, t).map((x) => x.t));
  $("mo-pins").innerHTML = apres("epingle", derniereVue, t).map((e) => {
    const [x, y] = MONDE.proj(e.lieu);
    const rx = ((x - vb[0]) / vb[2]) * 1080, py = ((y - vb[1]) / vb[3]) * 1920;
    if (rx < 40 || rx > 1040 || py < 260 || py > 1500) return "";
    const px = Math.max(150, Math.min(880, rx));
    const q = back(clamp((t - e.t) / 0.35));
    const c = COULEURS[e.couleur] ?? COULEURS.or;
    return `<div class="pin" style="left:${px}px;top:${py}px;transform:scale(${q})"><span data-texte>${fr(e.label ?? "")}</span><i style="background:${c}"></i></div>`;
  }).join("");
}
function mix(a, b, p) {
  const h = (c) => [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16));
  const [x, y] = [h(a), h(b)];
  return `rgb(${x.map((v, i) => Math.round(v + (y[i] - v) * p)).join(",")})`;
}

// Frise chronologique verticale : jalons placés à leur année, écarts surlignés.
function frise(t) {
  const fz = actif("frise", t, ARRETS);
  $("frise").style.display = fz ? "block" : "none";
  if (!fz) return;
  const a = fz.a;
  $("frise").style.opacity = clamp(fz.pIn * 2) * (1 - fz.pOut);
  $("fr-titre").innerHTML = fr(a.titre ?? "");
  const Y0 = 440, Y1 = 1320;
  const yAn = (an) => Y0 + ((an - a.min) / (a.max - a.min)) * (Y1 - Y0);
  $("fr-axe").style.top = `${Y0 - 30}px`;
  $("fr-axe").style.height = `${(Y1 - Y0 + 60) * ease(clamp((t - a.t) / 0.6))}px`;
  const suivante = tl.actions.find((x) => FORMATS.includes(x.type) && x.t > a.t);
  const tous = tl.actions.filter((x) => x.type === "jalon" && x.t >= a.t && (!suivante || x.t < suivante.t)).sort((x, y) => x.annee - y.annee);
  const pos = new Map();
  let dernier = -1e9;
  for (const j of tous) { const y = Math.max(yAn(j.annee), dernier + 110); pos.set(j, y); dernier = y; }
  const yDe = (an) => { const j = tous.find((x) => x.annee === an); return j ? pos.get(j) : yAn(an); };
  let html = tous.filter((j) => j.t <= t).map((j) => {
    const q = back(clamp((t - j.t) / 0.4));
    const an = j.etiquette ?? (j.annee < 0 ? `${-j.annee} av. J.-C.` : String(j.annee));
    return `<div class="jalon" style="top:${pos.get(j)}px;opacity:${clamp(q * 1.5)}"><span class="an" data-texte style="width:215px">${an}</span><span class="pt" style="transform:scale(${q})"></span><span class="ev" data-texte style="transform:translateX(${(1 - q) * 60}px)">${j.emoji ? j.emoji + " " : ""}${fr(j.texte)}</span></div>`;
  }).join("");
  html += apres("ecart", a.t, t).map((e) => {
    const y1 = yDe(e.de), y2 = yDe(e.a), q = ease(clamp((t - e.t) / 0.6));
    const haut = Math.min(y1, y2), h = Math.abs(y2 - y1);
    return `<div class="ecart" style="top:${haut - 20}px;height:${(h + 40) * q}px"></div><div class="ecart-l" data-texte style="top:${haut + h / 2}px;opacity:${q}">${fr(e.texte)}</div>`;
  }).join("");
  $("fr-jalons").innerHTML = html;
}

// Mur de cartes : défilement continu, puis une carte piochée au centre, retournée.
const MUR = script.mur ?? MUR_DEFAUT;
function mur(t) {
  const m = actif("mur", t, ARRETS);
  $("mur").style.display = m ? "block" : "none";
  if (!m) return;
  const a = m.a;
  $("mur").style.opacity = clamp(m.pIn * 2) * (1 - m.pOut);
  const grille = $("mu-grille");
  if (!grille.dataset.ok) {
    grille.dataset.ok = 1;
    const tuile = ([k, v, r], i) => {
      const nom = Object.keys(THEMES)[i % 8], c = THEMES[nom].couleur;
      return i % 4 === 1 ? `<div class="qc" style="background:${c};color:#1B1320;justify-content:space-between;text-align:left"><span class="i" style="font-size:54px">&#x${THEMES[nom].icone.toString(16)};</span><div class="v" style="font-size:40px">${nom}</div></div>`
        : `<div class="qc"><div class="k">${k}</div><div class="v">${fr(v)}</div><div class="a">${fr(r)}</div></div>`;
    };
    grille.innerHTML = [...MUR, ...MUR].map(tuile).join("");
  }
  const rangees = Math.ceil(MUR.length / 3), boucle = rangees * (330 + 26);
  const v = a.vitesse ?? 520;
  const pio = apres("piocher", a.t, t).at(-1);
  const dt = (pio ? pio.t : t) - a.t;
  let off = v * dt;
  if (pio) { const p = clamp((t - pio.t) / 0.9); off += v * 0.45 * (1 - (1 - p) ** 2); }
  grille.style.transform = `translateY(${-(off % boucle) + 160}px)`;
  grille.style.opacity = pio ? 1 - 0.6 * clamp((t - pio.t) / 0.5) : 1;
  const carte = $("mu-pioche");
  carte.style.display = pio ? "flex" : "none";
  if (pio) {
    const c = CARTES[pio.index ?? 0] ?? {};
    const q = back(clamp((t - pio.t - 0.3) / 0.5));
    const ret = apres("retourner", pio.t, t).at(-1);
    const pr = ret ? clamp((t - ret.t) / 0.4) : 0;
    const montre = pr >= 0.5;
    $("mu-k").textContent = c.indiceType ?? c.paquet ?? "";
    $("mu-v").innerHTML = fr(c.indice ?? c.question ?? "");
    $("mu-a").innerHTML = montre ? fr(c.reponse) : "?";
    $("mu-a").style.color = montre ? "#2B8A3E" : "#A29E94";
    carte.style.opacity = clamp(q * 1.5);
    carte.style.transform = `scale(${0.4 + 0.6 * q}) rotate(${(1 - q) * -8}deg) scaleX(${ret ? Math.abs(Math.cos(Math.PI * pr)) * 0.98 + 0.02 : 1})`;
  }
}

// Photo réaliste plein écran (images/<fichier> générée à l'étape 4), légende et révélation.
const PHOTOS = {};
for (const a of tl.actions.filter((x) => x.type === "photo")) {
  const img = new Image();
  img.src = `/projets/${projet}/images/${a.image}`;
  PHOTOS[a.image] = img;
}
await Promise.all(Object.values(PHOTOS).map((i) => i.decode().catch(() => console.error("Image introuvable : " + i.src))));
function photo(t) {
  const ph = actif("photo", t, ARRETS);
  $("photo").style.display = ph ? "block" : "none";
  if (!ph) return;
  const a = ph.a;
  $("photo").style.opacity = clamp(ph.pIn * 3) * (1 - ph.pOut);
  if ($("ph-img").dataset.src !== a.image) { $("ph-img").src = PHOTOS[a.image]?.src ?? ""; $("ph-img").dataset.src = a.image; }
  $("ph-img").style.transform = `scale(${1.04 + 0.1 * clamp((t - a.t) / 8)})`;
  $("ph-img").style.transformOrigin = a.foyer ?? "50% 50%";
  $("ph-leg").innerHTML = fr(a.legende ?? "");
  const dev = apres("devoiler", a.t, t).at(-1);
  $("ph-sous").innerHTML = dev ? fr(dev.nom) : "";
  $("ph-sous").style.transform = dev ? `scale(${back(clamp((t - dev.t) / 0.4))})` : "";
}

// Rafale façon jeu télé : score, barre de progression, coupe franche (flash) à chaque question.
function rafale(t) {
  const r = actif("rafale", t, ARRETS);
  $("rafale").style.display = r ? "block" : "none";
  if (!r) return;
  const a = r.a, total = a.total ?? 10;
  $("rafale").style.opacity = clamp(r.pIn * 3) * (1 - r.pOut);
  const qs = apres("question", a.t, t), cur = qs.at(-1);
  const bonnes = apres("bonne", a.t, t);
  $("ra-titre").textContent = a.titre ?? "Questions en rafale";
  $("ra-pts").textContent = `${bonnes.length}/${total}`;
  $("ra-prog").style.width = `${(100 * qs.length) / total}%`;
  $("ra-num").textContent = cur ? `Question ${qs.length}` : "";
  $("ra-q").innerHTML = cur ? fr(cur.texte) : fr(a.accroche ?? "Prêt ?");
  const rep = cur && bonnes.filter((b) => b.t >= cur.t).at(-1);
  $("ra-r").innerHTML = rep ? fr(rep.texte) : "";
  $("ra-r").style.transform = rep ? `scale(${back(clamp((t - rep.t) / 0.3))})` : "";
  $("ra-carte").style.transform = cur ? `scale(${0.92 + 0.08 * ease(clamp((t - cur.t) / 0.15))})` : "";
  $("ra-flash").style.opacity = cur ? 0.7 * (1 - clamp((t - cur.t) / 0.12)) : 0;
}

function formats2(t) { typo(t); monde(t); frise(t); mur(t); photo(t); rafale(t); }

// Élément visé par « choisir » selon l'étape de l'onboarding.
function idChoix(a, s) {
  if (s.etape === 1) return `o-theme-${DATA.onboarding.themes.indexOf(a.valeur)}`;
  if (s.etape === 2) return `o-rythme-${a.valeur}`;
  if (s.etape === 3) return a.valeur ? "o-oui" : "o-non";
  return null;
}

await demarrer(tl, renderAt);
</script>
